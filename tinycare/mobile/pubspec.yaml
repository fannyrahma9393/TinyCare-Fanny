name: tinycare_mobile
description: "TinyCare - Parent Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0

  # State Management
  provider: ^6.1.1

  # API & Network
  dio: ^5.4.0
  shared_preferences: ^2.2.2

  # Models
  intl: 0.20.2

  # Localization
  flutter_localizations:
    sdk: flutter

  # Utilities
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.5
  table_calendar: ^3.0.9
  url_launcher: ^6.3.0

  # Firebase Cloud Messaging (push notifications)
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
